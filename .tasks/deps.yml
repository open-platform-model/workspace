version: "3"

# Dependency pins that live OUTSIDE cue.mod/module.cue, where `deps:update`
# cannot see them. Run from the workspace root.
tasks:
  platform-pins:
    desc: "Bump the catalog versions pinned by Platform definitions outside a cue.mod file (opm-operator sample Platform, cli/hack/kind-platform.yaml) to the versions cli/hack/platform/cue.mod/module.cue pins, which deps:update:modules resolves under the active CUE_REGISTRY (GHCR under the canonical mapping); a YAML missing a pinned key fails"
    cmds:
      - .tasks/deps/platform-pins.sh

  opm-cli:
    desc: "Bump the opm CLI release CI installs in catalog_opm, modules, opm-operator and (when checked out) opm-modules workflows (core has none). Defaults to cli's newest published release whose tarball and checksums.txt download anonymously; VERSION=vX.Y.Z is verified the same way"
    preconditions:
      - sh: command -v git >/dev/null 2>&1
        msg: "git is required"
      - sh: command -v curl >/dev/null 2>&1
        msg: "curl is required"
    cmds:
      - .tasks/deps/opm-cli.sh {{.VERSION}}

  fixtures:
    desc: "Bump the CUE deps of the published test fixtures (cli/tests/fixtures, opm-operator/test/fixtures), advance each changed fixture's declared version and re-pin every consumer, whose core and catalog pins follow the fixture (operator modulepackages, moduleinstance/sample manifests, cli operator-owned/examples cue.mod) in one pass; one PR per repo, PR CI seeds its registry from the tree"
    cmds:
      - .tasks/deps/fixtures.sh
